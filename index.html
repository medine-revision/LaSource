 const ov=$('#ovr');if(ov)ov.onclick=()=>{score++;errs.pop();const s=STATS()[q.it.id];if(s){s.w--;s.r++}next()};
 const kb=$('#kb');if(kb)kb.style.display='none';
 $('#out').scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}
function next(){qi++;qi<Q.length?show():finish()}
function finish(){
 const n=Math.max(1,nAns);const pct=Math.round(score/n*100);
 if(nAns){if(ME){ME.hist.push({t:Date.now(),s:score,n:nAns,f:S.from,to:S.to,m:S.mode,d:S.diff});if(ME.hist.length>150)ME.hist=ME.hist.slice(-150)}persist()}
 const items=errs.map(e=>e.q.it);
 Q=[];
 app.innerHTML=`<section class="card"><div class="score">${pct}%</div><p>${score} bonne${score>1?'s':''} réponse${score>1?'s':''} sur ${nAns}.${ME?` Enregistré dans l'historique de ${esc(ME.name)}.`:' Entre ton prénom sur l\'accueil pour garder un historique.'}</p>
 <div class="actions"><button class="btn" id="again">Nouvelle série</button>${errs.length?'<button class="btn ghost" id="redo">Refaire mes erreurs</button>':''}</div></section>
 ${errs.length?`<section class="card"><h2>À revoir</h2>${errs.map(({q,user})=>`<div class="err"><span class="muted">${q.it.type==='g'?fmtPrompt(q.prompt):esc(q.ask)}</span>${q.it.type!=='g'?`<span class="${q.pAr?'ar':''}">${esc(q.pAr?showAr(q.prompt):q.prompt)}</span>`:''}<span class="${q.oAr?'ar':''}" style="color:var(--ok)">${esc(q.oAr?showAr(q.ans):q.ans)}</span>${user?`<span class="muted">Ta réponse : ${esc(user)}</span>`:''}</div>`).join('')}</section>`:''}`;
 $('#again').onclick=()=>home();
 const r=$('#redo');if(r)r.onclick=()=>start(null,shuf(items));
}

/* ---------- cours ---------- */
function cours(){
 const Ls=D.filter(L=>L.n>=S.from&&L.n<=S.to);const CH='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>';
 app.innerHTML=`<p class="muted" style="margin-top:0">Leçons ${S.from} à ${S.to} (modifiable dans « S'entraîner »). Ouvre une leçon pour voir son résumé, sa grammaire et son vocabulaire.<span class="sayhint"> Touche un mot arabe pour l'entendre.</span></p>`+Ls.map(L=>{
  const W=ITEMS.filter(i=>i.L===L.n);const words=W.filter(i=>i.type==='w'),ph=W.filter(i=>i.type==='p'),fo=W.filter(i=>i.type==='f');
  const [intro,...pts]=(SUM[L.n]||'').split('|');
  return `<details class="les"><summary><span class="num">${L.n}</span><span><b>${esc(L.t)}</b><br><span class="muted">Page ${L.p} · ${words.length} mots · ${L.g.length} règle${L.g.length>1?'s':''}</span></span><span class="c">${CH}</span></summary><div class="body">
  <div class="res"><h3>Résumé</h3><p>${esc(intro)}</p>${pts.length?`<ul>${pts.map(p=>`<li>${fmtPrompt(p)}</li>`).join('')}</ul>`:''}</div>
  <details class="sec"><summary>1. Grammaire <small>${L.g.length} règle${L.g.length>1?'s':''}</small><span class="c">${CH}</span></summary><div class="in">
  ${L.g.map(([t,d,ex])=>`<div class="rule"><h3>${esc(t)}</h3><p>${d}</p>${ex.map(([a,f])=>`<div class="exl"><span class="ar" data-say="${esc(stripH(a))}">${esc(showAr(a))}</span><span>${esc(f)}</span></div>`).join('')}</div>`).join('')}</div></details>
  <details class="sec"><summary>2. Vocabulaire <small>${words.length} mots${fo.length?' · '+fo.length+' formes':''}</small><span class="c">${CH}</span></summary><div class="in">
  ${words.length?`<table class="v">${words.map(w=>`<tr><td>${esc(w.fr.split('/').join(', '))}</td><td class="ar" data-say="${esc(stripH(w.ar))}">${esc(showAr(w.ar))}</td></tr>`).join('')}</table>`:''}
  ${fo.length?`<div class="sub">Pluriels, duels et féminins</div><table class="v">${fo.map(w=>`<tr><td>${esc(w.fr)} <span class="muted">(${KIND[w.kind].toLowerCase()})</span></td><td class="ar" data-say="${esc(stripH(w.form))}">${esc(showAr(w.base))} ← ${esc(showAr(w.form))}</td></tr>`).join('')}</table>`:''}</div></details>
  ${ph.length?`<details class="sec"><summary>3. Phrases d'exemple <small>${ph.length} phrases</small><span class="c">${CH}</span></summary><div class="in"><table class="v">${ph.map(w=>`<tr><td>${esc(w.fr)}</td><td class="ar" data-say="${esc(stripH(w.ar))}">${esc(showAr(w.ar))}</td></tr>`).join('')}</table></div></details>`:''}
  <button class="btn lesgo" type="button" data-les="${L.n}">S'entraîner sur cette leçon</button>
  </div></details>`}).join('');
 app.querySelectorAll('[data-les]').forEach(b=>b.onclick=()=>{const n=+b.dataset.les;S.from=n;S.to=Math.max(S.to,n);S.to=n;save();tab('train')});
}

/* ---------- démarrage ---------- */
home();
const remembered=LS.get('m1me',null);
(async()=>{
 try{if(window.claude&&claude.use){DB=await claude.use('db')}}catch(e){DB=null}
 dbState=DB?'ok':'none';
 if(remembered)await login(remembered);else if(view==='train'&&!Q.length)home();
 loadNames();
})();
}
</script>
</body>
</html>
